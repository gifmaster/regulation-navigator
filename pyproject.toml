[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulation-navigator"
version = "0.1.0"
description = "Which EU rules apply to your AI use case: AI Act, GDPR, NIS2 and DORA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Alexander Senderovitz", email = "alexander@senderovitz.eu"}]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2"]
dev = ["pytest>=8", "streamlit>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navigator = ["rules/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
